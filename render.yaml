services:
  - type: web
    name: satquery-backend
    runtime: docker
    dockerfilePath: Dockerfile.render
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: TASK_BACKEND
        value: inline
      - key: STORAGE_BACKEND
        value: local
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

